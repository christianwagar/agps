      - {"min": 90, "max_exclusive": 100, "score": 2}
      - {"min": 80, "max_exclusive": 90, "score": 3}
      - {"min": 70, "max_exclusive": 80, "score": 4}
      - {"min": 60, "max_exclusive": 70, "score": 5}
      - {"min": 50, "max_exclusive": 60, "score": 6}
      - {"min": 40, "max_exclusive": 50, "score": 7}
      - {"min": null, "max_exclusive": 40, "score": 8}

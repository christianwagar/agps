# A-GPS v2 config. Generated by tools/build_config.py from the 'A-GPS Logic | Elements to Measure' sheet.
# Golf-style: 1 = best, 8 = worst, blank = 8. Bands: min (inclusive), max_exclusive or max (inclusive); null = open.
# The first band that contains the value wins. Ordinal 'levels' map a label straight to a score ('na' = not applicable).
# After editing, regenerate the JSON twin: agps convert config/agps.v2.yaml config/agps.v2.json

name: "A-GPS v2 (Account Growth Propensity Scoring)"
version: "2.0.0"
scale: {"best": 1, "worst": 8, "missing_score": 8}

# Open decisions (see DECISIONS.md). Change a value here; every option has a working default.
options:
  # D1. sooner_is_better | runway_is_better | sweet_spot. Default matches the live model; his sheet note prefers runway.
  renewal_direction: "sooner_is_better"
  # D2. exclude (drop N/A fields from the bucket average) | score_missing (N/A scores 8).
  not_applicable: "exclude"
  # D3. When every field in a bucket is N/A/blank-NA: renormalize (drop the bucket, reweight the rest) | score_missing (bucket = 8).
  empty_bucket: "renormalize"
  # D4. true = score NBEC and CSQL $ as % of ARR so big accounts don't win twice.
  size_normalization: false
  # D5. Win-rate fields are N/A below this many closed opps/CSQLs.
  min_closed_opps: 3
  # D5b. NPS / CSAT are N/A below this many responses.
  min_survey_responses: 3
  # D7. true = apply per-field 'weight' inside buckets (e.g. csm_pulse_rag = 2). false = straight average.
  use_field_weights: false
  # D8. absolute ($ ladder) | percentile (octile rank within segment_field or the whole file).
  arr_scoring: "absolute"
  # D8b. Optional column used to group accounts for percentile ARR scoring.
  segment_field: null
  # D9. true = RAG not updated in 30+ days gets +1 band (needs csm_pulse_days_since_update).
  stale_rag_penalty: false

# Bucket weights (sum 1.0). Kept from the live model.
bucket_weights:
  gtm_propensity: 0.3
  post_sales: 0.25
  down_and_distance: 0.25
  marketing_programmatic_engagement: 0.1
  product: 0.1

# His sheet sections -> buckets.
section_to_bucket:
  "GTM": gtm_propensity
  "Marketing | Customer Programs Engagement": marketing_programmatic_engagement
  "Customer Success / Support / Services": post_sales
  "Product": product
  "Situation & Timing": down_and_distance

rounding: {"bucket_scores": 2, "overall_score": 3}

cluster: {"method": "quartile", "quartile": {"labels": ["P1", "P2", "P3", "P4"]}, "growth_arr_2x2": {"arr_high_max_band": 4}}

focus: {"count": 3, "window_days": 120, "renewal_field": "days_to_next_event"}

plays: {"P1": "Expand now: exec-aligned expansion, multi-thread, bring in AE + SE", "P2": "Grow into it: land-and-expand, programs, close the weakest bucket first", "P3": "Protect and re-ignite: retention first, fix health, find the next use case", "P4": "Scale and monitor: digital or pooled CS, watch for signals"}

fields:

  # TYPO FIX: sheet says >=$850,000,000 for band 2; read as $850,000. Bands 3-8 fill in his 'and so on' using the review ladder. Split from NRR (row 4 combined ARR | NRR).
  arr:
    bucket: "gtm_propensity"
    sheet_section: "GTM"
    sheet_row: 4
    element: "ARR"
    type: "number"
    direction: "higher_is_better"
    unit: "USD"
    bands:
      - {"min": 1000000, "max_exclusive": null, "score": 1}
      - {"min": 850000, "max_exclusive": 1000000, "score": 2}
      - {"min": 500000, "max_exclusive": 850000, "score": 3}
      - {"min": 250000, "max_exclusive": 500000, "score": 4}
      - {"min": 150000, "max_exclusive": 250000, "score": 5}
      - {"min": 100000, "max_exclusive": 150000, "score": 6}
      - {"min": 75000, "max_exclusive": 100000, "score": 7}
      - {"min": null, "max_exclusive": 75000, "score": 8}
    percentile_option: "arr_scoring"

  # Split out of row 4 'ARR | NRR'; a % can't share the $ ladder.
  nrr:
    bucket: "gtm_propensity"
    sheet_section: "GTM"
    sheet_row: 4
    element: "NRR"
    type: "number"
    direction: "higher_is_better"
    unit: "percent"
    bands:
      - {"min": 130, "max_exclusive": null, "score": 1}
      - {"min": 120, "max_exclusive": 130, "score": 2}
      - {"min": 110, "max_exclusive": 120, "score": 3}
      - {"min": 105, "max_exclusive": 110, "score": 4}
      - {"min": 100, "max_exclusive": 105, "score": 5}
      - {"min": 95, "max_exclusive": 100, "score": 6}
      - {"min": 90, "max_exclusive": 95, "score": 7}
      - {"min": null, "max_exclusive": 90, "score": 8}

  # TYPO FIX: sheet says >=$850,000.000 for band 2; read as $850,000. With size_normalization on, scored as % of ARR.
  nbec:
    bucket: "gtm_propensity"
    sheet_section: "GTM"
    sheet_row: 5
    element: "NBEC | NB (growth outside recurring revenue)"
    type: "number"
    direction: "higher_is_better"
    unit: "USD"
    bands:
      - {"min": 1000000, "max_exclusive": null, "score": 1}
      - {"min": 850000, "max_exclusive": 1000000, "score": 2}
      - {"min": 500000, "max_exclusive": 850000, "score": 3}
      - {"min": 250000, "max_exclusive": 500000, "score": 4}
      - {"min": 100000, "max_exclusive": 250000, "score": 5}
      - {"min": 50000, "max_exclusive": 100000, "score": 6}
      - {"min": 1, "max_exclusive": 50000, "score": 7}
      - {"min": null, "max_exclusive": 1, "score": 8}
    normalize: {"divide_by": "arr", "multiply": 100, "bands": [{"min": 50, "max_exclusive": null, "score": 1}, {"min": 30, "max_exclusive": 50, "score": 2}, {"min": 20, "max_exclusive": 30, "score": 3}, {"min": 10, "max_exclusive": 20, "score": 4}, {"min": 5, "max_exclusive": 10, "score": 5}, {"min": 2, "max_exclusive": 5, "score": 6}, {"min": 0.0001, "max_exclusive": 2, "score": 7}, {"min": null, "max_exclusive": 0.0001, "score": 8}]}

